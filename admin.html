<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Console · KAVO Grid</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/images/brand/app-icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EEF2F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  input, textarea, select, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cdd6e4; border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #b4c0d3; background-clip: content-box; }
</style>

<!-- Quotation document styles (used by the on-screen preview and the print/PDF). -->
<style id="pps-quote-print">
  #pps-print-root { display: none; }
  .pq { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0B1A33; background: #fff; width: 100%; max-width: 820px; margin: 0 auto; padding: 30px 34px 24px; box-sizing: border-box; font-size: 12.5px; line-height: 1.5; }
  .pq * { box-sizing: border-box; }
  .pq .pq-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 16px; border-bottom: 2px solid #0B1A33; }
  .pq-brand { display: flex; align-items: center; gap: 12px; }
  .pq-mark { width: 46px; height: 46px; border-radius: 11px; background: #0B1A33; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pq-co { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; }
  .pq-tag { font-size: 11px; font-weight: 700; color: #5A6B85; margin-top: 2px; }
  .pq-cohead { text-align: right; font-size: 11px; font-weight: 600; color: #5A6B85; line-height: 1.7; }
  .pq-titlebar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .pq-title { font-size: 26px; font-weight: 800; letter-spacing: 3px; color: #1457E6; }
  .pq-num { font-size: 13px; font-weight: 800; color: #0B1A33; }
  .pq-num span { color: #8A98B0; font-weight: 700; }
  .pq-meta { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; margin-top: 18px; }
  .pq-lbl { font-size: 10px; font-weight: 800; color: #8A98B0; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .pq-to { font-size: 12px; color: #5A6B85; line-height: 1.7; }
  .pq-cl { font-size: 15px; font-weight: 800; color: #0B1A33; margin-bottom: 2px; }
  .pq-facts { border: 1px solid #E4E9F2; border-radius: 10px; overflow: hidden; align-self: start; }
  .pq-fact { display: flex; justify-content: space-between; padding: 8px 13px; font-size: 12px; }
  .pq-fact:not(:last-child) { border-bottom: 1px solid #EDF1F7; }
  .pq-fact span { color: #8A98B0; font-weight: 700; }
  .pq-fact strong { color: #0B1A33; }
  table.pq-items { width: 100%; border-collapse: collapse; margin-top: 20px; }
  table.pq-items th { background: #0B1A33; color: #fff; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 9px 10px; text-align: left; }
  table.pq-items td { padding: 9px 10px; font-size: 12px; border-bottom: 1px solid #EDF1F7; vertical-align: top; }
  table.pq-items tbody tr:nth-child(even) { background: #F7F9FC; }
  table.pq-items .c { text-align: center; }
  table.pq-items .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.pq-items .mono { font-weight: 700; }
  table.pq-items .muted { color: #8A98B0; padding: 18px; }
  .pq-bottom { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; margin-top: 20px; align-items: start; }
  .pq-terms ol { margin: 6px 0 0; padding-left: 16px; font-size: 10.5px; color: #5A6B85; line-height: 1.65; }
  .pq-terms li { margin-bottom: 3px; }
  .pq-totals { border: 1px solid #E4E9F2; border-radius: 10px; overflow: hidden; }
  .pq-trow { display: flex; justify-content: space-between; padding: 9px 14px; font-size: 12.5px; }
  .pq-trow:not(:last-child) { border-bottom: 1px solid #EDF1F7; }
  .pq-trow span { color: #5A6B85; font-weight: 700; }
  .pq-trow strong { color: #0B1A33; font-variant-numeric: tabular-nums; }
  .pq-grand { background: #0B1A33; }
  .pq-grand span, .pq-grand strong { color: #fff; }
  .pq-grand strong { font-size: 15px; }
  .pq-sign { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 30px; }
  .pq-sigbox { width: 240px; }
  .pq-signame { font-size: 17px; font-weight: 800; font-style: italic; color: #0B1A33; height: 26px; }
  .pq-sigline { border-bottom: 1.5px solid #0B1A33; margin: 2px 0 6px; }
  .pq-sigmeta { font-size: 10.5px; color: #5A6B85; font-weight: 600; }
  .pq-thanks { text-align: right; }
  .pq-ty { font-size: 13px; font-weight: 800; color: #1457E6; }
  .pq-tysub { font-size: 10.5px; color: #8A98B0; margin-top: 2px; max-width: 260px; }
  .pq-foot { margin-top: 22px; padding-top: 12px; border-top: 1px solid #E4E9F2; text-align: center; font-size: 10px; color: #8A98B0; font-weight: 600; }
  @media print {
    @page { size: A4; margin: 12mm; }
    html, body { background: #fff !important; }
    body > #root { display: none !important; }
    #pps-print-root { display: block !important; }
    .pq { padding: 0; max-width: none; }
  }
</style>

<!-- Delivery Note + Local Purchase Order document styles (preview + print/PDF). -->
<style id="pps-doc-print">
  .pd{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0B1A33;background:#fff;width:100%;max-width:820px;margin:0 auto;padding:26px 34px 22px;box-sizing:border-box;font-size:12px;line-height:1.5}
  .pd *{box-sizing:border-box}
  .pd-copy{text-align:center;font-size:10px;font-weight:800;letter-spacing:4px;color:#8A98B0;margin-bottom:10px}
  .pd-head{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid #0B1A33}
  .pd-logo{height:48px;width:auto;display:block;flex-shrink:0}
  .pd-co{font-size:10.5px;font-weight:600;color:#5A6B85;line-height:1.65}
  .pd-coname{font-size:17px;font-weight:800;color:#0B1A33;letter-spacing:-.3px;margin-bottom:3px}
  .pd-co strong{color:#0B1A33}
  .pd-titlebar{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px}
  .pd-title{font-size:22px;font-weight:800;letter-spacing:2.4px;color:#1457E6}
  .pd-titlemeta{text-align:right}
  .pd-num{font-size:13px;font-weight:800;color:#0B1A33;font-variant-numeric:tabular-nums}
  .pd-date{font-size:11px;font-weight:600;color:#8A98B0;margin-top:2px}
  .pd-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:16px}
  .pd-meta-2{grid-template-columns:1.3fr 1fr}
  .pd-lbl{font-size:9.5px;font-weight:800;color:#8A98B0;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .pd-party{font-size:11px;color:#5A6B85;line-height:1.65}
  .pd-pname{font-size:13.5px;font-weight:800;color:#0B1A33;margin-bottom:2px}
  .pd-facts{border:1px solid #E4E9F2;border-radius:9px;overflow:hidden;align-self:start}
  .pd-fact{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;font-size:11px}
  .pd-fact:not(:last-child){border-bottom:1px solid #EDF1F7}
  .pd-fact span{color:#8A98B0;font-weight:700}
  .pd-fact strong{color:#0B1A33;text-align:right}
  table.pd-items{width:100%;border-collapse:collapse;margin-top:18px}
  table.pd-items th{background:#0B1A33;color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:8px 9px;text-align:left}
  table.pd-items td{padding:8px 9px;font-size:11.5px;border-bottom:1px solid #EDF1F7;vertical-align:top}
  table.pd-items tbody tr:nth-child(even){background:#F7F9FC}
  table.pd-items .c{text-align:center}
  table.pd-items .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.pd-items .mono{font-weight:700}
  table.pd-items .muted{color:#8A98B0;padding:16px}
  .pd-notes{margin-top:14px;font-size:11px;color:#5A6B85}
  .pd-words{font-size:11.5px;color:#0B1A33;font-weight:700}
  .pd-bottom{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-top:16px;align-items:start}
  .pd-totals{border:1px solid #E4E9F2;border-radius:9px;overflow:hidden}
  .pd-trow{display:flex;justify-content:space-between;padding:8px 13px;font-size:11.5px}
  .pd-trow:not(:last-child){border-bottom:1px solid #EDF1F7}
  .pd-trow span{color:#5A6B85;font-weight:700}
  .pd-trow strong{color:#0B1A33;font-variant-numeric:tabular-nums}
  .pd-grand{background:#0B1A33}
  .pd-grand span,.pd-grand strong{color:#fff}
  .pd-grand strong{font-size:14px}
  .pd-prepared{margin-top:16px;font-size:10.5px;color:#5A6B85;font-weight:600}
  .pd-sign{display:grid;gap:20px;margin-top:18px}
  .pd-sign-3{grid-template-columns:repeat(3,1fr)}
  .pd-signame{font-size:14px;font-weight:800;font-style:italic;color:#0B1A33;height:20px}
  .pd-sigline{border-bottom:1.2px solid #0B1A33;margin:14px 0 4px}
  .pd-sigmeta{font-size:9.5px;color:#8A98B0;font-weight:700}
  .pd-stamp{border:1.2px dashed #C3CDDD;border-radius:8px;height:70px;margin-top:6px}
  .pd-terms{margin-top:18px}
  .pd-terms ol{margin:4px 0 0;padding-left:15px;font-size:10px;color:#5A6B85;line-height:1.6}
  .pd-terms li{margin-bottom:2px}
  .pd-foot{margin-top:18px;padding-top:10px;border-top:1px solid #E4E9F2;text-align:center;font-size:9.5px;color:#8A98B0;font-weight:600;line-height:1.6}
  @media print{ .pd{padding:0;max-width:none} .pd-page{break-after:page;page-break-after:always} .pd-page:last-child{break-after:auto;page-break-after:auto} }
</style>


<!-- EmailJS browser SDK — sends the password-reset email directly from the page (no backend). -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<!-- Cloud sync: mirrors admin-owned data (hero media, products, rates,
     orders, records) to the Cloudflare D1 database via /api/sync so the admin
     controls the storefront on every computer/IP. -->
<script src="lib/cloud-sync.js"></script>

<!-- SheetJS — reads/writes the .xlsx bulk-product-import template. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<script type="text/babel" src="admin/store.jsx"></script>

</body>
</html>
