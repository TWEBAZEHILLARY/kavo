# Cloudflare Pages project config for kavogrid.org.
# The site is 100% static: Pages serves this folder as-is (no build step).
# Routing lives in _redirects, headers in _headers.
# Custom domains (kavogrid.org + www) are attached in the Pages dashboard.
name = "kavogrid"
compatibility_date = "2026-06-25"

[assets]
directory = "."
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
