# Cloudflare Workers (static assets) config for kavogrid.org.
# Deploy command in the Cloudflare project: npx wrangler deploy
# The repo root is uploaded as static assets. html_handling serves
# index.html at "/" and admin.html at "/admin" (no trailing slash).
name = "kavo"
compatibility_date = "2026-06-25"

[assets]
directory = "."
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
